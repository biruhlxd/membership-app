# Member portal: a full page in the customer account where members see their
# membership, next renewal and price, and can cancel. Merchants add it to the
# customer account menu in the checkout and accounts editor.
api_version = "2026-10"

[[extensions]]
name = "Membership"
handle = "member-portal"
type = "ui_extension"
uid = "a99ba6b0-8385-621e-df5f-4af292ac0f7fe866e914"

[[extensions.targeting]]
module = "./src/MemberPortal.jsx"
target = "customer-account.page.render"

[extensions.capabilities]
# Lets the page call the Customer Account API as the signed-in member.
api_access = true
# Lets the page call this app's own server (/api/portal) for organization
# seats. Needs Shopify's approval: Partner Dashboard > API access requests >
# "Allow network access in checkout and account UI extensions".
network_access = true

# On the order status page of a membership order: a link to the portal above
# (Shopify's subscription app requirement 5.4.9). Merchants place the block
# in the checkout and accounts editor.
[[extensions.targeting]]
module = "./src/OrderStatusLink.jsx"
target = "customer-account.order-status.block.render"
