# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5b2af7094b437997aa03d4454d25c5d3"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true
name = "Biruh Membership App"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Subscriptions also need read_customer_payment_methods, read_own_subscription_contracts and
# write_own_subscription_contracts. Shopify must approve those first (Partner Dashboard > API access
# requests); declaring them before approval makes Shopify refuse the app version. Add them once approved.
scopes = "read_customers,write_customers,read_products,write_products,read_purchase_options,write_purchase_options"

[webhooks]
# Keep in step with apiVersion in app/shopify.server.ts.
api_version = "2026-10"

  # Handled by: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  # Handled by: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Mandatory compliance topics for public apps; needed before App Store review.
  # See: https://shopify.dev/docs/apps/build/privacy-law-compliance
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/customers/data_request"
  # compliance_topics = ["customers/data_request"]

  # [[webhooks.subscriptions]]
  # uri = "/webhooks/customers/redact"
  # compliance_topics = ["customers/redact"]

  # [[webhooks.subscriptions]]
  # uri = "/webhooks/shop/redact"
  # compliance_topics = ["shop/redact"]

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
